spring.application.name=demo
#
#Live Reload 기능 활성화
spring.devtools.livereload.enabled=true
spring.devtools.remote.restart.enabled=true
spring.web.resources.static-locations=file:src/main/resources/static/
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
#
# 에러 응답에 예외 메시지(message) 포함 여부 - always: 항상 포함
server.error.include-message=always
# @Valid 검증 실패 시 바인딩 에러 상세 포함 여부
server.error.include-binding-errors=never
# 에러 응답에 스택트레이스 포함 여부
server.error.include-stacktrace=never
# 에러 응답에 예외 클래스명(exception) 포함 여부 - false: 미포함
server.error.include-exception=false
#
# ORM
# PostgreSQL JDBC 드라이버 클래스 지정
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate가 PostgreSQL 문법에 맞는 SQL을 생성하도록 지정하는 dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#
# PostgreSQL - CREATE USER user PASSWORD '!@#' SUPERUSER;
# DB 접속 URL (호스트:포트/DB명)
spring.datasource.url=jdbc:postgresql://localhost:54322/example?useSSL=false
# DB 접속 계정
spring.datasource.username=root
# DB 접속 비밀번호
spring.datasource.password=root
#
# 엔티티 기반으로 DDL(테이블 생성 SQL) 자동 생성 여부
spring.jpa.generate-ddl=true
# 애플리케이션 시작 시 테이블 처리 전략 - create: 기존 테이블 삭제 후 재생성 (개발용, 운영 절대 금지)
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL 쿼리를 콘솔에 출력할지 여부
spring.jpa.show-sql=true
# 데이터베이스에 쿼리 실행 시 예약어 제외 위한 추가 설정
spring.jpa.properties.hibernate.globally_quoted_identifiers=true