spring:
  application:
    name: demo

  # Live Reload 기능 활성화
  devtools:
    livereload:
      enabled: true
    remote:
      restart:
        enabled: true

  web:
    resources:
      static-locations: file:src/main/resources/static/

  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/


logging:
  level:
    org.springframework.security: DEBUG