<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
    <head>
        <meta charset="UTF-8">
        <title>Product Detail Information Page</title>
    </head>
    <body>
        <h1>Product Detail Information (ProductId: <span th:text="${id}"></span>)</h1>
        <div>Here is a product detail information</div>
        <div>- name : <span th:text="${name}"></span></div>
        <div>- price : <span th:text="${price}"></span></div>
        <div>- stock : <span th:text="${stock}"></span></div>
        <div>- deleted : <span th:text="${deleted}"></span></div>
    </body>
</html>
